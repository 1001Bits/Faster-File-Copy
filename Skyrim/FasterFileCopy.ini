[General]
; Master switch; when disabled, no hooks or cache workers are started.
bEnabled=1

; Benchmark-only pass-through mode that maps no archives and serves no cache data.
bBaselineMode=0

; Collect aggregate timing and byte counters (benchmarking only).
bMeasureStats=0

; Aggregate statistics log interval in seconds.
iStatsIntervalSec=5

; Log every individual read (very slow, debugging only).
bLogReads=0

; Serve uncompressed BSA reads from demand-paged, read-only memory mappings.
bEnableMmap=1

; Persist decompressed BSA entries to disk and reuse them on later loads.
bEnableDecompCache=1

; Warm the decompression cache into RAM in the background after launch.
bPrefaultDecompCache=1

; Serve entries from the decompression cache once they are warmed.
bServeDecompCache=1

; Keep mmap/cache acceleration active during save and transition loads.
bEnableDuringSaveLoad=1

; Cache growth: 0 = capture startup only, 1 = keep learning during gameplay.
iDecompCacheMode=1

; Maximum cache size in MiB; 0 = automatic (25% of RAM, which also caps positive values).
iDecompCacheMaxMB=0

; Optional absolute cache directory; empty = Data\SKSE\Plugins\FasterFileCopy_cache.
sCacheDir=
