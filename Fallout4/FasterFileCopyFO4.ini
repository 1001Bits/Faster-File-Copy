[General]
; Force vanilla pass-through (kill switch).
bBaselineMode = false
; Minimum hook invasiveness for problem setups.
bCompatibilityMode = false
; SAVE LOAD / GAMEPLAY log lines for benchmarking.
bEnableStats = false

[Archives]
; Memory-map BA2 archives.
bEnableMmap = true

[DecompCache]
; Cache compressed non-texture entries (scripts, meshes, materials).
bEnableGNRLCache = true
; Cache DX10 texture chunks.
bEnableTextureCache = true
; On-disk cache size cap in MB. 0 = unlimited.
iMaxMB = 2048

[Saves]
; Pre-warm recent save files at main menu.
bPrefetchRecentSaves = true
iPrefetchSaveCount = 3

[Plugins]
; EXPERIMENTAL — mmap+prefault plugin files instead of sequential read.
; Better page-cache retention; only recommended for 1000+ plugins on >=16 GB RAM.
bMmapPlugins = false
